media:
  input: images
  output: /images
content:
  - name: illustration
    label: Illustration gallery
    type: file
    path: data/illustration.json
    format: json
    list: true
    fields:
      - name: image
        label: Image
        type: image
      - name: title
        label: Title
        type: string
      - name: subtitle
        label: Short description
        type: string
  - name: game-design
    label: Game design gallery
    type: file
    path: data/game-design.json
    format: json
    list: true
    fields:
      - name: image
        label: Image
        type: image
      - name: title
        label: Title
        type: string
      - name: subtitle
        label: Short description
        type: string
